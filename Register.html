<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | SERNO_HUB GAMES</title><link rel="stylesheet" href="style.css"></head><body>
<div class="form-card">
<div class="logo" style="text-align:center;margin-bottom:20px">SERNO_HUB <span>// GAMING</span></div>
<div class="kicker" style="text-align:center">PLAYER REGISTRATION</div><h1>JOIN THE BATTLE</h1><p class="sub">Create your SERNO_HUB player profile.</p>
<form onsubmit="registerUser(event)"><label>Player Name</label><input id="name" required placeholder="Your gaming name"><label>Email</label><input id="email" type="email" required placeholder="gamer@example.com"><label>Password</label><input id="password" type="password" required placeholder="Minimum 6 characters"><label>Confirm Password</label><input id="confirm" type="password" required placeholder="Repeat password"><button class="btn" type="submit">REGISTER</button><div id="msg" class="msg"></div></form>
<p class="small">Already have an account? <a href="Login.html">Login</a></p>
</div><script src="script.js"></script></body></html>
